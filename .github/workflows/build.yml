name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      singbox_version:
        description: "sing-box version without the v, e.g. 1.14.4 (blank = 1.14.4, or type latest)"
        required: false
        default: ""
      hev_ref:
        description: "hev-socks5-tunnel tag/commit (blank = default branch)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_VERSION: v1
  NDK_VERSION: 27.2.12479018

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Native libs (sing-box + hev tun2socks) and the map asset only change when the
      # versions or scripts change, so restore them instead of rebuilding every run.
      # Bump CACHE_VERSION to force a refresh (e.g. to pick up a newer hev default branch).
      - name: Restore native libs + map cache
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/assets/world.bin
          key: native-${{ env.CACHE_VERSION }}-sb${{ github.event.inputs.singbox_version || '1.14.4' }}-hev${{ github.event.inputs.hev_ref || 'default' }}-${{ hashFiles('scripts/**') }}${{ github.event.inputs.singbox_version == 'latest' && format('-{0}', github.run_id) || '' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Install NDK (only when native libs must be rebuilt)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Fetch sing-box binaries (official release)
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          SINGBOX_VERSION: ${{ github.event.inputs.singbox_version }}
        run: bash scripts/fetch-singbox.sh

      - name: Build tun2socks (hev-socks5-tunnel) with the NDK
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          HEV_REF: ${{ github.event.inputs.hev_ref }}
        run: bash scripts/build-native.sh

      - name: Build world map asset (Natural Earth borders)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          [ -f app/src/main/assets/world.bin ] || python3 scripts/build-map.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # Pull requests only build arm64 (fast check); main/tags build every ABI.
      - name: Build APK
        run: |
          extra=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then extra="-Pabis=arm64-v8a"; fi
          gradle :app:assembleRelease --build-cache --parallel $extra

      - name: Rename APK
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed 's/^app-//; s/-release$//')
            cp "$f" "dist/OutrunVpn-${GITHUB_REF_NAME//\//-}-$abi.apk"
          done
          ls -lh dist

      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-arm64-v8a.apk
          archive: false
          if-no-files-found: error

      - name: Upload APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-armeabi-v7a.apk
          archive: false
          if-no-files-found: warn

      - name: Upload APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          path: dist/*-x86_64.apk
          archive: false
          if-no-files-found: ${{ github.event_name == 'pull_request' && 'warn' || 'error' }}

      - name: Send APKs to Telegram bot
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set, skipping"
            exit 0
          fi
          api="https://api.telegram.org/bot${TG_TOKEN}"
          for f in dist/*.apk; do
            size=$(stat -c%s "$f")
            caption="Outrun VPN ${GITHUB_REF_NAME} (${GITHUB_SHA::7})
          $(basename "$f")"
            if [ "$size" -gt 49000000 ]; then
              # Telegram bots can't upload files over 50 MB, so send a link instead
              curl -sS -X POST "$api/sendMessage" \
                -d chat_id="$TG_CHAT" \
                --data-urlencode text="$caption
          Too big for Telegram ($((size/1000000)) MB). Download from: $RUN_URL"
            else
              curl -sS -X POST "$api/sendDocument" \
                -F chat_id="$TG_CHAT" \
                -F document=@"$f" \
                -F caption="$caption"
            fi
            echo
          done

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
